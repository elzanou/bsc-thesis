[project]
name = "music-evalkit"
version = "0.1.0"
description = "Evaluation framework for testing Audio Language Models as music tutors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas",
    "openpyxl",
    "yt-dlp",
    "torch",
    "transformers",
    "accelerate",  # Required for device_map in transformers
    "sentence-transformers",
    "google-generativeai",
    "openai",
    "python-dotenv",
    "tqdm",
    "click",
    "pyyaml>=6.0.3",
    "librosa",
    "numba>=0.57",  # Requires Python 3.11+ compatible version
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "runpod",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_evalkit"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
